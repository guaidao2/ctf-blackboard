name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet and test
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

      - name: Check frontend syntax
        run: node --check internal/client/web/app.js

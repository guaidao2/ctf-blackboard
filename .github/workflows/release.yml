name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: test / vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1
      - name: Check frontend syntax
        run: node --check internal/client/web/app.js

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="ctfbb-${version}-${GOOS}-${GOARCH}"
          ldflags="-s -w -X github.com/guaidao2/ctf-blackboard/internal/server.Version=${version} -X github.com/guaidao2/ctf-blackboard/internal/client.Version=${version}"
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags "$ldflags" -o "dist/${name}/ctfbb-server${suffix}" ./cmd/ctfbb-server
          go build -trimpath -ldflags "$ldflags" -o "dist/${name}/ctfbb-client${suffix}" ./cmd/ctfbb-client
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: ctfbb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.goos != 'windows'
        with:
          name: ctfbb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Use per-tag release notes when present
        id: notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "body_path=docs/releases/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with curated notes
        if: steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: dist/*
          draft: false
          prerelease: false

      - name: Publish with generated notes
        if: steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: dist/*
          draft: false
          prerelease: false
